name: release-fork

# Builds the fork's CLI binaries and publishes them as GitHub release assets, so users can install
# without npm:
#   curl -fsSL https://raw.githubusercontent.com/KRFOSS/opencode/dev/install.sh | bash
#
# This is a fork-only workflow: upstream releases are produced by .github/workflows/release.yml, which
# needs R2 credentials, signing identities and blacksmith runners this fork does not have.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "all Linux and Windows x64 targets, or a comma separated list (linux-x64, windows-x64, ...)"
        required: false
        default: "all"
      tag:
        description: "Release tag (default: v<package version>-krfoss.<run number>)"
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

concurrency:
  group: release-fork
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The tag and the version the binary reports have to agree, so both are decided once, up front.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Plan requested targets
        id: targets
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          requested="${REQUESTED// /}"
          if [ -z "$requested" ] || [ "$requested" = all ]; then
            requested="linux-x64,linux-x64-baseline,linux-x64-musl,linux-x64-baseline-musl,windows-x64,windows-x64-baseline"
          fi
          IFS=',' read -ra targets <<< "$requested"
          linux_targets=()
          windows_targets=()
          for target in "${targets[@]}"; do
            case "$target" in
              linux-x64|linux-x64-baseline|linux-x64-musl|linux-x64-baseline-musl) linux_targets+=("$target") ;;
              windows-x64|windows-x64-baseline) windows_targets+=("$target") ;;
              *) echo "::error::Unsupported target: $target (only Linux and Windows x64 are enabled)"; exit 1 ;;
            esac
          done
          matrix=$(jq -cn --arg linux "${linux_targets[*]}" --arg windows "${windows_targets[*]}" '{include: [
            (if $linux != "" then {group: "linux", os: ["self-hosted", "linux", "x64"], targets: $linux} else empty end),
            (if $windows != "" then {group: "windows", os: "ubuntu-24.04", targets: $windows} else empty end)
          ]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/cli/package.json)
          tag="${INPUT_TAG:-v${version}-krfoss.${GITHUB_RUN_NUMBER}}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "releasing $tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    name: build ${{ matrix.group }}
    # The Linux cross-compile runs on this project's own machine (`r3`, Linux x64): the workflow is manual-only so no
    # fork pull request can reach it, and it keeps that part of a release off hosted minutes. `runs-on` comes from the
    # matrix, so the Windows group does not queue behind the Linux one on the single `r3` runner: Windows targets are
    # cross-compiled from Linux anyway (`BUN_COMPILE_RELEASE` downloads each target's Bun), and the build script below
    # is bash with globs and `basename`, so it stays on a Linux runner (`ubuntu-24.04`) instead of a Windows one,
    # where it would need Git Bash and Windows paths. `publish` stays hosted because it needs `zip`, `gh` and
    # `sha256sum`, and `r3` has no passwordless `sudo`.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Allocate runners only for the platform families requested by the manual release.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/cli
        env:
          TARGETS: ${{ matrix.targets }}
          # Without this the binary reports 0.0.0-dev-1 and asks to update to an upstream release.
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          # Cross-compiles by downloading the matching Bun release binary for each target.
          BUN_COMPILE_RELEASE: bun-v1.4.4
          # Read-only; raises the rate limit for Bun release downloads.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for t in $TARGETS; do
            echo "::group::build $t"
            # A separate outdir per target: build.ts wipes the outdir on every run.
            OPENCODE_TARGET="$t" bun run build --outdir="dist-one/$t"
            echo "::endgroup::"
          done

          rm -rf dist-one/*/.bun
          mkdir -p dist
          for dir in dist-one/*/cli-*; do
            [ -d "$dir" ] || continue
            cp -a "$dir" "dist/$(basename "$dir")"
          done
          ls -d dist/cli-*
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.group }}
          path: packages/cli/dist/cli-*
          if-no-files-found: ignore
          compression-level: 0

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: packages/cli/dist
          pattern: cli-*
          merge-multiple: true
      - name: Archive
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p dist/archives
          cd packages/cli/dist
          count=0
          for dir in cli-*; do
            [ -d "$dir/bin" ] || continue
            target="${dir#cli-}"
            exe="opencode"
            case "$target" in windows-*) exe="opencode.exe" ;; esac
            if [ ! -f "$dir/bin/$exe" ]; then
              echo "::error::$dir/bin/$exe is missing"
              exit 1
            fi
            if [ "${target#linux-}" != "$target" ]; then
              chmod +x "$dir/bin/$exe"
              tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$WORKSPACE/dist/archives/opencode-$target.tar.gz" -C "$dir/bin" "$exe"
            else
              ( cd "$dir/bin" && zip -X -q "$WORKSPACE/dist/archives/opencode-$target.zip" "$exe" )
            fi
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no CLI build was found to archive"
            exit 1
          fi
          echo "packaged $count target(s)"
      - name: Smoke test the Linux build
        env:
          EXPECTED: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          bin=packages/cli/dist/cli-linux-x64/bin/opencode
          if [ ! -f "$bin" ]; then
            echo "::notice::linux-x64 was not requested; skipping Linux smoke test"
            exit 0
          fi
          chmod +x "$bin"
          out=$(timeout 120 "$bin" --version) || { echo "::error::the linux-x64 binary does not start"; exit 1; }
          echo "$out"
          # Catches a build that ignored OPENCODE_VERSION and would report 0.0.0-dev-1 to users.
          case "$out" in
            *"$EXPECTED"*) ;;
            *) echo "::error::expected version $EXPECTED, got $out"; exit 1 ;;
          esac
      - name: Checksums and installer
        run: |
          set -euo pipefail
          cp install.sh dist/archives/install.sh
          cd dist/archives
          sha256sum opencode-* > SHA256SUMS
          ls -lh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -uo pipefail
          assets=(dist/archives/*)
          echo "publishing $TAG (assets: ${#assets[@]}, $(du -sh dist/archives | cut -f1))"

          # gh 는 실패 사유를 표준 오류에만 남기고 잡 로그는 로그인해야 보인다. 그래서 사유를
          # 주석(::error::)으로도 남기고, 정식 생성이 실패하면 초안으로 올린 뒤 정식으로 바꾸는
          # 우회 경로를 한 번 더 시도한다.
          publish() {
            local extra="$1"; shift
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ROKFOSS OpenCode $TAG" \
              --generate-notes \
              $extra "$@"
          }

          # `--target <sha>` 는 릴리스에 워크플로 파일 변경이 포함되면 `workflows: write` 를 요구하고,
          # GITHUB_TOKEN 은 그 스코프를 선언할 수 없어 "HTTP 403: Resource not accessible by
          # integration" 으로 거절된다(cli/cli#9514, GitHub changelog 2023-11-02). 이 워크플로는
          # 워크플로 파일을 자주 고치므로 그 조건에 자주 걸린다. 태그를 직접 만들어 두고
          # `--verify-tag` 로 릴리스하면 같은 커밋을 가리키면서 `workflows: write` 가 필요 없다.
          publish_via_tag() {
            local extra="$1"; shift
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null 2>&1 || true
            gh release create "$TAG" \
              --verify-tag \
              --title "ROKFOSS OpenCode $TAG" \
              --generate-notes \
              $extra "$@"
          }

          cleanup() {
            gh release delete "$TAG" --yes >/dev/null 2>&1 || true
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          }

          if [ "$INPUT_DRAFT" = "true" ]; then
            if ! out=$(publish --draft "${assets[@]}" 2>&1); then
              echo "::error::초안 릴리스 생성 실패: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-600)"
              exit 1
            fi
          elif out=$(publish "" "${assets[@]}" 2>&1); then
            echo "published $TAG"
          elif out_tag=$(publish_via_tag "" "${assets[@]}" 2>&1); then
            # --target 이 workflows: write 를 요구해 거절된 경우의 정상 경로다.
            echo "published $TAG (태그를 직접 만들고 --verify-tag 로 릴리스)"
          else
            echo "::warning::정식 생성이 실패해 초안 경로로 다시 시도합니다. --target: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300) / 태그: $(printf '%s' "$out_tag" | tr '\n' ' ' | cut -c1-300)"
            cleanup
            if ! out2=$(publish_via_tag --draft "${assets[@]}" 2>&1); then
              echo "::error::정식·초안 두 경로 모두 실패. 정식: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300) / 태그: $(printf '%s' "$out_tag" | tr '\n' ' ' | cut -c1-300) / 초안: $(printf '%s' "$out2" | tr '\n' ' ' | cut -c1-300)"
              cleanup
              exit 1
            fi
            if ! out3=$(gh release edit "$TAG" --draft=false 2>&1); then
              echo "::error::초안은 만들어졌지만 정식 전환에 실패: $(printf '%s' "$out3" | tr '\n' ' ' | cut -c1-600)"
              cleanup
              exit 1
            fi
            echo "published $TAG (draft 경로)"
          fi

          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "curl -fsSL https://raw.githubusercontent.com/KRFOSS/opencode/dev/install.sh | bash" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
