name: release-fork

# Builds the fork's CLI binaries and publishes them as GitHub release assets, so users can install
# without npm:
#   curl -fsSL https://raw.githubusercontent.com/KRFOSS/opencode/dev/install.sh | bash
#
# This is a fork-only workflow: upstream releases are produced by .github/workflows/release.yml, which
# needs R2 credentials, signing identities and blacksmith runners this fork does not have.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "all Linux and Windows targets, or a comma separated list (linux-x64, windows-x64, ...)"
        required: false
        default: "all"
      tag:
        description: "Release tag (default: v<package version>-krfoss.<run number>)"
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

concurrency:
  group: release-fork
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The tag and the version the binary reports have to agree, so both are decided once, up front.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate requested targets
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          requested="${REQUESTED// /}"
          if [ -z "$requested" ] || [ "$requested" = all ]; then exit 0; fi
          IFS=',' read -ra targets <<< "$requested"
          for target in "${targets[@]}"; do
            case "$target" in
              linux-x64|linux-arm64|linux-x64-baseline|linux-arm64-musl|linux-x64-musl|linux-x64-baseline-musl|windows-x64|windows-arm64|windows-x64-baseline) ;;
              *) echo "::error::Unsupported target: $target (only Linux and Windows are enabled)"; exit 1 ;;
            esac
          done
      - id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/cli/package.json)
          tag="${INPUT_TAG:-v${version}-krfoss.${GITHUB_RUN_NUMBER}}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "releasing $tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    name: build ${{ matrix.group }}
    # The heavy cross-compile runs on this project's own machine (`r3`, Linux x64): it is the only thing sent there,
    # the workflow is manual-only so no fork pull request can reach it, and it keeps a release off hosted minutes.
    # The three platform groups queue on that one runner instead of running in parallel, so a release takes longer;
    # `publish` stays hosted because it needs `zip`, `gh` and `sha256sum`, and `r3` has no passwordless `sudo` to
    # install anything missing.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One job per platform family: each target needs its own `bun build --compile` pass, and the
        # shared install + web-asset build dominates the runtime, so grouping is cheaper than one job
        # per target and much faster than one job for all nine.
        group: [linux, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/cli
        env:
          GROUP: ${{ matrix.group }}
          # Without this the binary reports 0.0.0-dev-1 and asks to update to an upstream release.
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          # Cross-compiles by downloading the matching Bun release binary for each target.
          BUN_COMPILE_RELEASE: bun-v1.4.4
          # Read-only; raises the rate limit for Bun release downloads.
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          case "$GROUP" in
            linux)   group_targets="linux-x64 linux-arm64 linux-x64-baseline linux-arm64-musl linux-x64-musl linux-x64-baseline-musl" ;;
            windows) group_targets="windows-x64 windows-arm64 windows-x64-baseline" ;;
          esac

          targets=""
          for t in $group_targets; do
            if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
              targets="$targets $t"
              continue
            fi
            case ",${REQUESTED// /}," in
              *",$t,"*) targets="$targets $t" ;;
            esac
          done

          if [ -z "${targets// /}" ] && [ -n "$REQUESTED" ] && [ "$REQUESTED" != "all" ]; then
            echo "::notice::no $GROUP target was requested; skipping"
            mkdir -p dist
            exit 0
          fi

          for t in $targets; do
            echo "::group::build $t"
            # A separate outdir per target: build.ts wipes the outdir on every run.
            OPENCODE_TARGET="$t" bun run build --outdir="dist-one/$t"
            echo "::endgroup::"
          done

          rm -rf dist-one/*/.bun
          mkdir -p dist
          for dir in dist-one/*/cli-*; do
            [ -d "$dir" ] || continue
            cp -a "$dir" "dist/$(basename "$dir")"
          done
          ls -d dist/cli-*
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.group }}
          path: packages/cli/dist/cli-*
          if-no-files-found: ignore
          compression-level: 0

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: packages/cli/dist
          pattern: cli-*
          merge-multiple: true
      - name: Archive
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p dist/archives
          cd packages/cli/dist
          count=0
          for dir in cli-*; do
            [ -d "$dir/bin" ] || continue
            target="${dir#cli-}"
            exe="opencode"
            case "$target" in windows-*) exe="opencode.exe" ;; esac
            if [ ! -f "$dir/bin/$exe" ]; then
              echo "::error::$dir/bin/$exe is missing"
              exit 1
            fi
            if [ "${target#linux-}" != "$target" ]; then
              chmod +x "$dir/bin/$exe"
              tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$WORKSPACE/dist/archives/opencode-$target.tar.gz" -C "$dir/bin" "$exe"
            else
              ( cd "$dir/bin" && zip -X -q "$WORKSPACE/dist/archives/opencode-$target.zip" "$exe" )
            fi
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no CLI build was found to archive"
            exit 1
          fi
          echo "packaged $count target(s)"
      - name: Smoke test the Linux build
        env:
          EXPECTED: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          bin=packages/cli/dist/cli-linux-x64/bin/opencode
          if [ ! -f "$bin" ]; then
            echo "::notice::linux-x64 was not requested; skipping Linux smoke test"
            exit 0
          fi
          chmod +x "$bin"
          out=$(timeout 120 "$bin" --version) || { echo "::error::the linux-x64 binary does not start"; exit 1; }
          echo "$out"
          # Catches a build that ignored OPENCODE_VERSION and would report 0.0.0-dev-1 to users.
          case "$out" in
            *"$EXPECTED"*) ;;
            *) echo "::error::expected version $EXPECTED, got $out"; exit 1 ;;
          esac
      - name: Checksums and installer
        run: |
          set -euo pipefail
          cp install.sh dist/archives/install.sh
          cd dist/archives
          sha256sum opencode-* > SHA256SUMS
          ls -lh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$INPUT_DRAFT" = "true" ]; then flags+=("--draft"); fi

          echo "publishing $TAG"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ROKFOSS OpenCode $TAG" \
            --generate-notes \
            "${flags[@]}" \
            dist/archives/*

          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "curl -fsSL https://raw.githubusercontent.com/KRFOSS/opencode/dev/install.sh | bash" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
