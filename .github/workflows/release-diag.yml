name: release-diag

# 임시 진단 워크플로(마지막). 앞선 진단에서 릴리스 생성·대용량 업로드는 모두 성공했고,
# 실패한 실행과 남은 차이는 태그 이름(v2.3.0-…)과 초안 여부뿐이었다.
# 그래서 태그 이름/초안 여부만 바꿔 본다. 끝나면 이 파일은 지운다.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 태그 이름·초안 여부 시험
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          echo "== rulesets =="
          gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            --jq '.[] | "\(.name) target=\(.target) enforcement=\(.enforcement)"' 2>&1 || true
          gh api "repos/${GITHUB_REPOSITORY}/rulesets" --jq 'length' 2>&1 || true

          try() {
            label="$1"; tag="$2"; shift 2
            out=$(gh release create "$tag" --target "$GITHUB_SHA" --title "diag" "$@" 2>&1); code=$?
            if [ "$code" -eq 0 ]; then
              gh release delete "$tag" --yes >/dev/null 2>&1 || true
              echo "::notice::${label} 성공(정리함)"
            else
              msg=$(printf '%s' "$out" | tr '\n' ' ')
              echo "::error::${label} 실패(exit $code): ${msg:0:500}"
            fi
          }

          # 1) 실제 릴리스와 같은 태그 모양 + 초안
          try "v2.3.0 태그·초안" "v2.3.0-diag.${GITHUB_RUN_NUMBER}" --draft --notes "diag"
          # 2) 실제 릴리스와 같은 태그 모양 + 정식
          try "v2.3.0 태그·정식" "v2.3.0-diagpub.${GITHUB_RUN_NUMBER}" --notes "diag"
          # 3) 다른 태그 모양 + 정식 (대조군)
          try "일반 태그·정식" "v0.0.0-diagpub.${GITHUB_RUN_NUMBER}" --notes "diag"
