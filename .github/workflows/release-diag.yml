name: release-diag

# 임시 진단 워크플로. release-fork 의 publish 단계에서 gh release create 가 실패하는데
# 잡 로그는 로그인해야 보이므로, 실패 사유를 공개 주석(::error::)으로 드러내기 위해 잠깐 둔다.
# 1차 진단: 릴리스 생성 자체는 성공(두 방식 모두). 그래서 에셋 업로드를 크기별로 시험한다.
# 원인을 찾으면 이 파일은 지운다.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Diagnose release asset uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="v0.0.0-diag.${GITHUB_RUN_NUMBER}"

          echo "== disk =="
          df -h / | tail -1

          echo "== create draft release =="
          if ! out=$(gh release create "$tag" --target "$GITHUB_SHA" --draft --title "diag" --notes "diag" 2>&1); then
            msg=$(printf '%s' "$out" | tr '\n' ' ')
            echo "::error::초안 생성 실패: ${msg:0:600}"
            exit 1
          fi

          mkdir -p files
          head -c 1024 /dev/urandom > files/small-1k.bin
          head -c 150000000 /dev/urandom > files/medium-150m.bin
          head -c 400000000 /dev/urandom > files/large-400m.bin
          ls -l files

          total_ok=0
          for f in files/small-1k.bin files/medium-150m.bin files/large-400m.bin; do
            name=$(basename "$f")
            echo "== upload $name =="
            if out=$(gh release upload "$tag" "$f" 2>&1); then
              echo "ok $name"
              total_ok=$((total_ok + 1))
            else
              code=$?
              msg=$(printf '%s' "$out" | tr '\n' ' ')
              echo "::error::업로드 실패 $name (exit $code): ${msg:0:600}"
            fi
          done

          echo "== uploaded $total_ok/3 =="
          gh release view "$tag" --json assets --jq '.assets[].name' 2>&1 || true

          gh release delete "$tag" --yes >/dev/null 2>&1 || true
          echo "::notice::업로드 성공 $total_ok/3 (초안은 지움)"
