name: release-diag

# 임시 진단 워크플로. release-fork 의 publish 단계가 gh release create 에서 실패하는데
# 잡 로그는 로그인해야 보이므로, 실패 사유를 공개 주석(::error::)으로 드러내기 위해 잠깐 둔다.
# 1차: 릴리스 생성 자체는 성공. 2차: 업로드도 1KB·150MB·400MB 모두 성공.
# 3차: 실패한 실행(#15)의 아티팩트를 그대로 받아 publish 절차를 그대로 재현한다(빌드 없음).
# 원인을 찾으면 이 파일은 지운다.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 아티팩트 가져오기 (실패한 #15 실행)
        uses: actions/download-artifact@v4
        with:
          path: packages/cli/dist
          pattern: cli-*
          merge-multiple: true
          run-id: 43841711140
          github-token: ${{ github.token }}

      - name: Archive (publish 단계와 같은 스크립트)
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -uo pipefail
          mkdir -p dist/archives
          cd packages/cli/dist
          count=0
          for dir in cli-*; do
            [ -d "$dir/bin" ] || continue
            target="${dir#cli-}"
            exe="opencode"
            case "$target" in windows-*) exe="opencode.exe" ;; esac
            if [ ! -f "$dir/bin/$exe" ]; then
              echo "::error::$dir/bin/$exe 가 없습니다"
              exit 1
            fi
            if [ "${target#linux-}" != "$target" ]; then
              chmod +x "$dir/bin/$exe"
              tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$WORKSPACE/dist/archives/opencode-$target.tar.gz" -C "$dir/bin" "$exe"
            else
              ( cd "$dir/bin" && zip -X -q "$WORKSPACE/dist/archives/opencode-$target.zip" "$exe" )
            fi
            count=$((count + 1))
          done
          echo "packaged $count target(s)"

      - name: Checksums
        run: |
          set -uo pipefail
          cp install.sh dist/archives/install.sh
          cd dist/archives
          sha256sum opencode-* > SHA256SUMS
          echo "== assets =="
          ls -l
          echo "== total =="
          du -sh .

      - name: Publish 재현
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="v0.0.0-diag.${GITHUB_RUN_NUMBER}"
          echo "== disk =="
          df -h / | tail -1
          echo "== create+upload with all real assets =="
          out=$(gh release create "$tag" --target "$GITHUB_SHA" --draft \
                  --title "diag" --generate-notes dist/archives/* 2>&1); code=$?
          printf '%s\n' "$out" | tail -15
          if [ "$code" -eq 0 ]; then
            gh release delete "$tag" --yes >/dev/null 2>&1 || true
            echo "::notice::실제 산출물로도 성공(초안은 지움)"
          else
            msg=$(printf '%s' "$out" | tr '\n' ' ')
            echo "::error::실제 산출물 업로드 실패(exit $code): ${msg:0:600}"
          fi
