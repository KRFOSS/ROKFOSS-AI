name: check-bot-scope

# Checks manually prepared bot/nix-hashes branches: only a valid nix/hashes.json may change.
# Every other branch passes. The hash workflow uploads artifacts without creating branches or pull requests.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot-scope:
    name: bot-scope
    if: ${{ (github.head_ref || github.ref_name) == 'bot/nix-hashes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check changed files
        env:
          BASE: ${{ github.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "Changed files:"
          echo "$changed"
          if [ "$changed" != nix/hashes.json ]; then
            echo "::error::bot/nix-hashes may change only nix/hashes.json"
            exit 1
          fi

      # Runs dev's validator: the step above proved this branch leaves .github/ unchanged.
      - name: Validate nix/hashes.json
        run: bash .github/nix-hashes/validate.sh nix/hashes.json
