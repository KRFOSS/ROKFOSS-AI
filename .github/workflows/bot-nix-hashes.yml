name: bot-nix-hashes

# Computes native Linux dependency hashes and uploads nix/hashes.json for manual review.
# A mismatch fails after uploading the artifact. This workflow never commits, pushes, or opens or merges a PR.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/**/package.json"
      - "services/*/package.json"
      - "flake.nix"
      - "flake.lock"
      - "nix/hashes.json"
      - "nix/node_modules.nix"
      - "nix/scripts/**"
      - "patches/**"
      - ".github/nix-hashes/validate.sh"
      - ".github/workflows/bot-nix-hashes.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native runners required: bun install cross-compilation flags (--os/--cpu)
  # do not produce byte-identical node_modules as native installs.
  hash:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Compute node_modules hash
        id: hash
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail

          BUILD_LOG=$(mktemp)
          trap 'rm -f "$BUILD_LOG"' EXIT

          HASH=""
          MAX_ATTEMPTS=3
          for ((ATTEMPT = 1; ATTEMPT <= MAX_ATTEMPTS; ATTEMPT++)); do
            # Build with fakeHash to trigger hash mismatch and reveal correct hash
            nix build ".#packages.${SYSTEM}.node_modules_updater" --no-link 2>&1 | tee "$BUILD_LOG" || true

            HASH="$(nix run --inputs-from . nixpkgs#gnugrep -- -oP 'got:\s*\Ksha256-[A-Za-z0-9+/=]+' "$BUILD_LOG" | tail -n1 || true)"

            [ -n "$HASH" ] && break

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Attempt ${ATTEMPT}/${MAX_ATTEMPTS} produced no hash for ${SYSTEM}; retrying in $((ATTEMPT * 10))s"
              sleep $((ATTEMPT * 10))
            fi
          done

          if [ -z "$HASH" ]; then
            echo "::error::Failed to compute hash for ${SYSTEM} after ${MAX_ATTEMPTS} attempts"
            cat "$BUILD_LOG"
            exit 1
          fi

          echo "$HASH" > hash.txt
          echo "Computed hash for ${SYSTEM}: $HASH"

      - name: Upload hash
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hash-${{ matrix.system }}
          path: hash.txt
          retention-days: 1

  # Assembles and validates the per-system hashes, then uploads the proposed file for review.
  compute:
    needs: hash
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download hash artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/hashes
          pattern: hash-*

      - name: Update hashes.json
        id: update
        env:
          HASHES: ${{ runner.temp }}/hashes
        run: |
          set -euo pipefail

          HASH_FILE="nix/hashes.json"

          [ -f "$HASH_FILE" ] || echo '{"nodeModules":{}}' > "$HASH_FILE"

          # Preserve the existing Darwin hash while macOS builds are paused.
          for SYSTEM in x86_64-linux aarch64-linux; do
            HASH="$(tr -d '[:space:]' < "$HASHES/hash-${SYSTEM}/hash.txt")"
            echo "${SYSTEM}: ${HASH}"
            jq --arg sys "$SYSTEM" --arg h "$HASH" '.nodeModules[$sys] = $h' "$HASH_FILE" > tmp.json
            mv tmp.json "$HASH_FILE"
          done

          cat "$HASH_FILE"
          bash .github/nix-hashes/validate.sh "$HASH_FILE"

          if git diff --quiet -- "$HASH_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Nix hashes" >> "$GITHUB_STEP_SUMMARY"
            echo "Status: no changes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Nix hashes" >> "$GITHUB_STEP_SUMMARY"
            echo "Status: changed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload hashes.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nix-hashes
          path: nix/hashes.json
          if-no-files-found: error
          retention-days: 7

      - name: Check recorded hashes
        if: steps.update.outputs.changed == 'true'
        run: |
          echo "::error::Dependency hashes changed. Review the nix-hashes artifact and update nix/hashes.json manually."
          exit 1
